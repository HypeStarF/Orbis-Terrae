name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make Gradle launcher executable
        run: chmod +x gradlew

      - name: Regenerate Gradle 9.6.1 wrapper
        shell: bash
        run: |
          ./gradlew :wrapper \
            --gradle-version=9.6.1 \
            --distribution-type=bin \
            --gradle-distribution-sha256-sum=9c0f7faeeb306cb14e4279a3e084ca6b596894089a0638e68a07c945a32c9e14 \
            --no-configuration-cache \
            --warning-mode=fail
          ./gradlew :wrapper \
            --gradle-distribution-sha256-sum=9c0f7faeeb306cb14e4279a3e084ca6b596894089a0638e68a07c945a32c9e14 \
            --no-configuration-cache \
            --warning-mode=fail
          echo "497c8c2a7e5031f6aa847f88104aa80a93532ec32ee17bdb8d1d2f67a194a9c7  gradle/wrapper/gradle-wrapper.jar" | sha256sum --check -

      - name: Commit regenerated wrapper
        if: github.event_name == 'push' && github.ref_name == 'agent/gradle-9.6.1'
        shell: bash
        run: |
          if git diff --quiet -- gradlew gradlew.bat gradle/wrapper; then
            echo "Wrapper files are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
          git commit -m "build: regenerate Gradle 9.6.1 wrapper"
          git push

      - name: Upload generated wrapper
        uses: actions/upload-artifact@v7
        with:
          name: gradle-9.6.1-wrapper
          path: |
            gradlew
            gradlew.bat
            gradle/wrapper/gradle-wrapper.jar
            gradle/wrapper/gradle-wrapper.properties
          if-no-files-found: error

      - name: Verify Phase 0
        shell: bash
        run: |
          set -o pipefail
          ./gradlew clean phase0Check --no-configuration-cache --warning-mode=fail --stacktrace 2>&1 | tee gradle-build.log

      - name: Upload Gradle log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gradle-build-log
          path: gradle-build.log
          if-no-files-found: error

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-reports
          path: '**/build/reports/**'
          if-no-files-found: ignore
