name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install GDAL
        run: |
          sudo apt-get update
          sudo apt-get install --yes gdal-bin
          gdalinfo --version

      - name: Verify GIS normalization tool
        shell: bash
        run: |
          set -o pipefail
          {
            python -m py_compile \
              scripts/gis/normalize_atlas.py \
              scripts/gis/build_bergen_real_atlas.py \
              scripts/gis/build_northern_europe_detailed_atlas.py
            python -m unittest discover -s scripts/gis -p 'test_*.py' -v
            python scripts/gis/normalize_atlas.py plan atlas/profiles/gdal-normalization-example.json > /dev/null
            python scripts/gis/build_bergen_real_atlas.py plan > /dev/null
            python scripts/gis/build_bergen_real_atlas.py verify atlas/test-fixtures/bergen-real-v1.zip
            python scripts/gis/build_northern_europe_detailed_atlas.py plan > /dev/null
            python scripts/gis/build_northern_europe_detailed_atlas.py \
              --profile atlas/profiles/northern-europe-detailed-smoke.json \
              plan > /dev/null
          } 2>&1 | tee gis-normalization.log

      - name: Upload GIS normalization log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gis-normalization-log
          path: gis-normalization.log
          if-no-files-found: error

      - name: Make Gradle launcher executable
        run: chmod +x gradlew

      - name: Verify Gradle 9.6.1 wrapper
        shell: bash
        run: |
          echo "497c8c2a7e5031f6aa847f88104aa80a93532ec32ee17bdb8d1d2f67a194a9c7  gradle/wrapper/gradle-wrapper.jar" | sha256sum --check -
          grep -Fqx 'distributionSha256Sum=9c0f7faeeb306cb14e4279a3e084ca6b596894089a0638e68a07c945a32c9e14' gradle/wrapper/gradle-wrapper.properties
          grep -Fqx 'distributionUrl=https\://services.gradle.org/distributions/gradle-9.6.1-bin.zip' gradle/wrapper/gradle-wrapper.properties
          ./gradlew --version --no-configuration-cache | grep -F 'Gradle 9.6.1'

      - name: Verify Phase 0
        shell: bash
        run: |
          set -o pipefail
          ./gradlew clean phase0Check --no-configuration-cache --warning-mode=fail --stacktrace 2>&1 | tee gradle-build.log

      - name: Upload Gradle log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gradle-build-log
          path: gradle-build.log
          if-no-files-found: ignore

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-reports
          path: '**/build/reports/**'
          if-no-files-found: ignore

  real-atlas-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install GDAL
        run: |
          sudo apt-get update
          sudo apt-get install --yes gdal-bin
          gdalinfo --version

      - name: Rebuild and compare Bergen real-data atlas
        shell: bash
        run: |
          chmod +x gradlew
          python scripts/gis/build_bergen_real_atlas.py build \
            build/bergen-real-v1 \
            --require-locked \
            --compare atlas/test-fixtures/bergen-real-v1.zip

      - name: Upload Bergen atlas fixture
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bergen-real-v1-atlas
          path: |
            build/bergen-real-v1/atlas
            build/bergen-real-v1/bergen-real-v1.zip
          if-no-files-found: error

  regional-atlas-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install GDAL raster calculator
        run: |
          sudo apt-get update
          sudo apt-get install --yes gdal-bin python3-gdal python3-numpy
          gdalinfo --version
          gdal_calc.py --help > /dev/null

      - name: Build pinned regional smoke atlas
        shell: bash
        run: |
          chmod +x gradlew
          python scripts/gis/build_northern_europe_detailed_atlas.py \
            --profile atlas/profiles/northern-europe-detailed-smoke.json \
            build build/northern-europe-detailed-smoke \
            --cache build/regional-atlas-source-cache
          python scripts/gis/build_northern_europe_detailed_atlas.py \
            --profile atlas/profiles/northern-europe-detailed-smoke.json \
            verify build/northern-europe-detailed-smoke/northern-europe-detailed-smoke.zip

      - name: Upload regional smoke atlas
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: northern-europe-detailed-smoke
          path: |
            build/northern-europe-detailed-smoke/atlas
            build/northern-europe-detailed-smoke/northern-europe-detailed-smoke.zip
          if-no-files-found: error

  windows-atlas-tests:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Run GIS normalization tests
        shell: pwsh
        run: |
          python -m py_compile scripts/gis/normalize_atlas.py scripts/gis/build_bergen_real_atlas.py scripts/gis/build_northern_europe_detailed_atlas.py
          python -m unittest discover -s scripts/gis -p "test_*.py"
          python scripts/gis/normalize_atlas.py plan atlas/profiles/gdal-normalization-example.json | Out-Null
          python scripts/gis/build_bergen_real_atlas.py plan | Out-Null
          python scripts/gis/build_bergen_real_atlas.py verify atlas/test-fixtures/bergen-real-v1.zip | Out-Null
          python scripts/gis/build_northern_europe_detailed_atlas.py plan | Out-Null
          python scripts/gis/build_northern_europe_detailed_atlas.py --profile atlas/profiles/northern-europe-detailed-smoke.json plan | Out-Null

      - name: Run atlas tests
        shell: pwsh
        run: |
          .\gradlew.bat :modules:atlas-api:test :modules:atlas-compiler:test --no-configuration-cache --warning-mode=fail --stacktrace

      - name: Upload Windows test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-atlas-test-reports
          path: '**/build/reports/tests/**'
          if-no-files-found: ignore
