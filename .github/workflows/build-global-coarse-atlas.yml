name: Build Global Coarse Atlas

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-global-atlas:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Restore global source cache
        uses: actions/cache@v6
        with:
          path: build/global-atlas-source-cache
          key: global-coarse-v1-sources-${{ hashFiles('atlas/datasets/global-coarse-v1/sources.lock.json') }}

      - name: Install GDAL raster tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes gdal-bin python3-gdal python3-numpy
          gdalinfo --version
          gdal_calc.py --help > /dev/null

      - name: Build global coarse atlas
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          python scripts/gis/build_global_coarse_atlas.py plan | tee global-coarse-plan.json
          python scripts/gis/build_global_coarse_atlas.py \
            build build/global-coarse-v1 \
            --cache build/global-atlas-source-cache \
            2>&1 | tee global-coarse-build.log
          python scripts/gis/build_global_coarse_atlas.py \
            verify build/global-coarse-v1/global-coarse-v1.zip
          sha256sum build/global-coarse-v1/global-coarse-v1.zip \
            | tee global-coarse-archive.sha256

      - name: Upload global coarse atlas
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: global-coarse-v1
          path: |
            build/global-coarse-v1/atlas
            build/global-coarse-v1/global-coarse-v1.zip
            global-coarse-plan.json
            global-coarse-build.log
            global-coarse-archive.sha256
          if-no-files-found: error
          retention-days: 30
