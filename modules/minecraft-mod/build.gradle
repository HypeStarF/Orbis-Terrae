static boolean nestedJarContainsClass(
        ZipFile outerJar,
        List<ZipEntry> nestedJarEntries,
        String classPath,
        Path temporaryDirectory
) {
    for (ZipEntry nestedJarEntry : nestedJarEntries) {
        Path nestedJarPath = Files.createTempFile(temporaryDirectory, 'nested-', '.jar')
        try {
            InputStream input = outerJar.getInputStream(nestedJarEntry)
            try {
                Files.copy(input, nestedJarPath, StandardCopyOption.REPLACE_EXISTING)
            } finally {
                input.close()
            }

            ZipFile nestedJar = new ZipFile(nestedJarPath.toFile())
            try {
                if (nestedJar.getEntry(classPath) != null) {
                    return true
                }
            } finally {
                nestedJar.close()
            }
        } finally {
            Files.deleteIfExists(nestedJarPath)
        }
    }
    return false
}

plugins {
    id 'java-library'
    id 'net.neoforged.moddev'
    id 'idea'
}

final Provider<String> artifactId = providers.gradleProperty('artifact_id')
final Provider<String> modId = providers.gradleProperty('mod_id')
final Provider<String> neoVersion = providers.gradleProperty('neo_version')
final Provider<String> parchmentMappingsVersion = providers.gradleProperty('parchment_mappings_version')
final Provider<String> parchmentMinecraftVersion = providers.gradleProperty('parchment_minecraft_version')
final String moduleVersion = version.toString()

base {
    archivesName = artifactId.get()
}

sourceSets.named('main') {
    resources {
        srcDir('src/generated/resources')
    }
}

tasks.named('processResources') {
    from(rootProject.file('atlas/test-fixtures/bergen-real-v1.zip')) {
        into('data/orbis_terrae/atlas')
    }
}

neoForge {
    version = neoVersion.get()

    parchment {
        mappingsVersion = parchmentMappingsVersion.get()
        minecraftVersion = parchmentMinecraftVersion.get()
    }

    runs {
        client {
            client()
            systemProperty('neoforge.enabledGameTestNamespaces', modId.get())
        }

        server {
            server()
            programArgument('--nogui')
            systemProperty('neoforge.enabledGameTestNamespaces', modId.get())
        }

        gameTestServer {
            type = 'gameTestServer'
            systemProperty('neoforge.enabledGameTestNamespaces', modId.get())
        }

        data {
            data()
            programArguments.addAll(
                    '--mod', modId.get(),
                    '--all',
                    '--output', file('src/generated/resources').absolutePath,
                    '--existing', file('src/main/resources').absolutePath
            )
        }

        configureEach {
            systemProperty('forge.logging.markers', 'REGISTRIES')
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${modId.get()}" {
            sourceSet(sourceSets.named('main').get())
        }
    }
}

final Configuration localRuntime = configurations.maybeCreate('localRuntime')
configurations.named('runtimeClasspath') {
    extendsFrom(localRuntime)
}

dependencies {
    implementation(project(':modules:atlas-api'))
    implementation(project(':modules:compatibility-api'))

    jarJar(project(':modules:atlas-api'))
    jarJar(project(':modules:compatibility-api'))

    additionalRuntimeClasspath(project(':modules:atlas-api'))
    additionalRuntimeClasspath(project(':modules:compatibility-api'))
}

final TaskProvider<Jar> productionJar = tasks.named('jar', Jar)

tasks.register('verifyProductionJar') {
    group = 'verification'
    description = 'Verifies that the installable mod JAR contains its internal runtime libraries.'
    dependsOn(productionJar)
    inputs.file(productionJar.flatMap { Jar task -> task.archiveFile })

    doLast {
        File modJarFile = productionJar.get().archiveFile.get().asFile
        String expectedName = "${artifactId.get()}-${moduleVersion}.jar"
        if (modJarFile.name != expectedName) {
            throw new GradleException(
                    "Installable mod JAR must be unclassified; expected ${expectedName}, got ${modJarFile.name}")
        }

        Path temporaryDirectory = Files.createTempDirectory('orbis-production-jar-')
        ZipFile modJar = new ZipFile(modJarFile)
        try {
            if (modJar.getEntry('META-INF/jarjar/metadata.json') == null) {
                throw new GradleException('Installable mod JAR is missing META-INF/jarjar/metadata.json')
            }
            if (modJar.getEntry('data/orbis_terrae/atlas/bergen-real-v1.zip') == null) {
                throw new GradleException('Installable mod JAR is missing the bundled Bergen atlas')
            }

            List<ZipEntry> nestedJars = Collections.list(modJar.entries()).findAll { ZipEntry entry ->
                !entry.directory
                        && entry.name.startsWith('META-INF/jarjar/')
                        && entry.name.endsWith('.jar')
            }
            if (nestedJars.isEmpty()) {
                throw new GradleException('Installable mod JAR contains no nested runtime libraries')
            }

            Map<String, String> requiredClasses = [
                    'atlas-api'        : 'me/sdmannen/orbis_terrae/atlas/store/AtlasDirectory.class',
                    'compatibility-api': 'me/sdmannen/orbis_terrae/compatibility/api/CompatibilityProvider.class'
            ]
            requiredClasses.each { String library, String classPath ->
                if (!nestedJarContainsClass(modJar, nestedJars, classPath, temporaryDirectory)) {
                    throw new GradleException(
                            "Installable mod JAR does not contain ${library} class ${classPath}")
                }
            }
        } finally {
            modJar.close()
            Files.deleteIfExists(temporaryDirectory)
        }
    }
}

final Map<String, String> modMetadataProperties = [
        minecraft_version      : providers.gradleProperty('minecraft_version').get(),
        minecraft_version_range: providers.gradleProperty('minecraft_version_range').get(),
        neo_version            : neoVersion.get(),
        loader_version_range   : providers.gradleProperty('loader_version_range').get(),
        mod_id                 : modId.get(),
        mod_name               : providers.gradleProperty('mod_name').get(),
        mod_license            : providers.gradleProperty('mod_license').get(),
        mod_version            : providers.gradleProperty('mod_version').get(),
        mod_authors            : providers.gradleProperty('mod_authors').get(),
        mod_description        : providers.gradleProperty('mod_description').get()
]

final TaskProvider<ProcessResources> generateModMetadata = tasks.register(
        'generateModMetadata',
        ProcessResources
) {
    inputs.properties(modMetadataProperties)
    expand(modMetadataProperties)
    from('src/main/templates')
    into(layout.buildDirectory.dir('generated/sources/modMetadata'))
}

sourceSets.named('main') {
    resources.srcDir(generateModMetadata)
}
neoForge.ideSyncTask(generateModMetadata)

