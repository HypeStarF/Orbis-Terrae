tasks.register('phase2RuntimePreparationCheck') {
    group = 'verification'
    description = 'Generates and verifies NeoForge client and dedicated-server run argument files.'
    dependsOn tasks.named('prepareClientRun')
    dependsOn tasks.named('prepareServerRun')

    doLast {
        File moddevDirectory = layout.buildDirectory.dir('moddev').get().asFile
        List<String> requiredFiles = ['clientRunVmArgs.txt', 'serverRunVmArgs.txt']
        requiredFiles.each { String filename ->
            File argumentFile = new File(moddevDirectory, filename)
            if (!argumentFile.isFile() || argumentFile.length() == 0L) {
                throw new GradleException("Missing generated NeoForge run arguments: ${argumentFile}")
            }
        }
    }
}

tasks.register('phase2WorldgenSmoke') {
    group = 'verification'
    description = 'Loads NeoForge headlessly to decode the Phase 2 world-generation registries.'
    dependsOn tasks.named('runGameTestServer')
}
