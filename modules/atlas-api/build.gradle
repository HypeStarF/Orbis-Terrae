import org.gradle.api.tasks.testing.Test

plugins {
    id 'java-library'
}

dependencies {
    api(libs.jackson.databind)
}

sourceSets {
    test {
        resources {
            srcDir(rootProject.file('docs/schemas'))
            srcDir(rootProject.file('atlas/test-fixtures/manifest-v1'))
        }
    }
}

base {
    archivesName = 'orbis-terrae-atlas-api'
}

tasks.register('phase0Test', Test) {
    group = 'verification'
    description = 'Runs the Phase 0 Minecraft-dependency boundary regression test.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    filter {
        includeTestsMatching('me.sdmannen.orbis_terrae.atlas.api.NoMinecraftDependencyTest')
    }
}
