pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'orbis-terrae'

include 'modules:minecraft-mod'
include 'modules:atlas-api'
include 'modules:atlas-compiler'
include 'modules:compatibility-api'
include 'modules:compatibility-mekanism'
include 'modules:compatibility-immersive-engineering'
include 'modules:test-support'
